<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forest Guardians Hero Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: night-forest stage; a step panel on the left, the hero card growing live on the right. Stacks on phones. */
:root{
  color-scheme: dark;
  --night:#0c1310;
  --night-2:#121c17;
  --panel:rgba(14,22,18,.86);
  --line:rgba(226,240,214,.16);
  --ink:#f2efe3;
  --ink-dim:#b9c2b2;
  --moss:#9bd56a;
  --moss-deep:#2f4a22;
  --heart:#ff5d73;
  --str:#ff8f5e;
  --spd:#5fd6ea;
  --brn:#c7a2ff;
  --display:"Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --body:"Nunito", "Trebuchet MS", system-ui, sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--night);
  color:var(--ink);
  font:400 17px/1.45 var(--body);
  min-height:100vh;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-bottom:48px;
  overflow-x:hidden;
}
img{max-width:100%}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--moss);outline-offset:3px}

/* ---------- atmosphere ---------- */
.backdrop{position:fixed;inset:0;z-index:-2;background:var(--night)}
.backdrop::before{content:"";position:absolute;inset:-40px;background:var(--cover) center 20%/cover no-repeat;filter:blur(14px) saturate(1.1);opacity:.32}
.backdrop::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%, transparent 0%, rgba(12,19,16,.55) 45%, var(--night) 85%)}
.fireflies{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.fireflies i{position:absolute;width:6px;height:6px;border-radius:50%;background:#e9ff9b;box-shadow:0 0 10px 3px rgba(214,255,120,.55);opacity:0;animation:drift 9s ease-in-out infinite}
@keyframes drift{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}50%{opacity:.4;transform:translate(28px,-40px)}80%{opacity:.85}100%{opacity:0;transform:translate(-14px,-90px)}}
@media (prefers-reduced-motion:reduce){.fireflies{display:none}*{transition:none!important;animation:none!important}}

.wrap{max-width:1180px;margin:0 auto}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:max(14px, env(safe-area-inset-top, 0px));padding-bottom:6px;flex-wrap:wrap}
.top .brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer}
.top .brand img{height:62px;width:auto;filter:drop-shadow(0 4px 14px rgba(0,0,0,.6))}
.top .sub{font:700 13px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:999px;border:2px solid var(--line);background:rgba(255,255,255,.04);font-weight:800;cursor:pointer;transition:transform .12s, background .12s, border-color .12s;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.09);border-color:rgba(226,240,214,.35)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--moss);border-color:var(--moss);color:#14200d}
.btn.primary:hover{background:#b0e584}
.btn.primary:disabled{background:rgba(155,213,106,.25);border-color:transparent;color:rgba(20,32,13,.6);cursor:not-allowed;transform:none}
.btn.small{min-height:38px;padding:6px 14px;font-size:15px}
.btn.danger{border-color:rgba(255,93,115,.5);color:#ffc2cb}
.btn.danger:hover{background:rgba(255,93,115,.14)}

/* ---------- party view ---------- */
.hero-banner{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;margin:18px 0 26px}
.hero-banner h1{font:800 clamp(40px,6vw,68px)/.95 var(--display);margin:0 0 10px;letter-spacing:.01em;text-wrap:balance;text-shadow:0 3px 18px rgba(0,0,0,.6)}
.hero-banner > div > p{margin:0;color:var(--ink-dim);max-width:52ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;backdrop-filter:blur(6px)}
.players{min-width:0;display:flex;flex-direction:column;gap:18px}
.players-q{display:flex;flex-direction:column;gap:4px}
.players h2,.section-h{font:800 26px/1.1 var(--display);margin:0;letter-spacing:.02em}
.players .hint{margin:0;color:var(--ink-dim);font-size:15px}
.count-row{display:flex;gap:8px;flex-wrap:wrap}
.count{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:rgba(255,255,255,.04);font:900 24px/1 var(--body);cursor:pointer;transition:transform .12s, background .12s}
.count:hover{transform:translateY(-2px);background:rgba(255,255,255,.1)}
.count[aria-pressed="true"]{background:var(--moss);color:#14200d;border-color:var(--moss)}
.rule-note{margin:0;font-size:15px;line-height:1.5;text-wrap:pretty;padding:12px 16px;border-radius:10px;background:rgba(155,213,106,.12);border:1px solid rgba(155,213,106,.3)}
.rule-note b{color:var(--moss)}
.players.ask{border-color:var(--moss);box-shadow:0 0 0 4px rgba(155,213,106,.15), 0 0 40px rgba(155,213,106,.15)}

.party-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
.party-tools{display:flex;gap:8px;flex-wrap:wrap}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px;align-items:start}
.slot{display:flex;flex-direction:column;gap:10px;align-items:center}
.slot .card{--card-fs:12px}
.slot-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.new-hero{width:300px;max-width:100%;aspect-ratio:5/7;border:3px dashed rgba(155,213,106,.45);border-radius:18px;background:rgba(155,213,106,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;font:800 30px/1.05 var(--display);color:var(--ink);transition:background .15s, transform .15s;padding:20px;text-align:center}
.new-hero:hover{background:rgba(155,213,106,.13);transform:translateY(-3px)}
.new-hero .plus{width:72px;height:72px;border-radius:50%;background:var(--moss);color:#14200d;font:900 48px/72px var(--body)}
.new-hero small{font:600 15px/1.3 var(--body);color:var(--ink-dim)}
.saved-note{font-size:14px;color:var(--ink-dim);margin-top:26px;max-width:70ch}

/* ---------- builder ---------- */
.builder{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:start;margin-top:14px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;padding:0;list-style:none}
.steps li{font:800 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.05);color:var(--ink-dim);border:1px solid transparent}
.steps li.done{color:var(--moss);border-color:rgba(155,213,106,.3)}
.steps li.now{background:var(--moss);color:#14200d}
.step-panel{min-height:420px}
.step-q{font:800 clamp(32px,4.5vw,46px)/1.02 var(--display);margin:0 0 6px;text-wrap:balance}
.step-help{margin:0 0 20px;color:var(--ink-dim);max-width:60ch}
.step-nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}

.field label{display:block;font-weight:800;margin-bottom:6px}
.text-in{width:100%;min-height:56px;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.35);font-size:22px;font-weight:800}
.text-in:focus{border-color:var(--moss);outline:none}
textarea.text-in{font-size:18px;font-weight:600;min-height:84px;resize:vertical}
.name-row{display:flex;gap:10px;align-items:stretch}
.name-row .text-in{flex:1;min-width:0}
.dice-btn{flex:none;min-height:56px;border-radius:12px;padding:8px 16px;gap:8px}
.dice-btn svg{width:26px;height:26px;transition:transform .35s}
.dice-btn.roll svg{transform:rotate(360deg)}
@media (max-width:420px){.dice-btn .lbl{display:none}}
.count-left{font-size:13px;color:var(--ink-dim);text-align:right;margin-top:4px}

.portraits{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:18px}
.portrait{position:relative;aspect-ratio:3/4;border-radius:12px;border:2px solid var(--line);background:radial-gradient(circle at 50% 70%, rgba(155,213,106,.18), rgba(0,0,0,.3));cursor:pointer;padding:6px;display:flex;align-items:flex-end;justify-content:center;transition:transform .12s, border-color .12s}
.portrait img{max-height:100%;object-fit:contain}
.portrait:hover{transform:translateY(-3px)}
.portrait[aria-pressed="true"]{border-color:var(--moss);box-shadow:0 0 0 3px rgba(155,213,106,.35)}
.portrait.none{align-items:center;font-weight:800;color:var(--ink-dim);font-size:14px;text-align:center}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.choice{position:relative;text-align:left;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.04);padding:16px;cursor:pointer;transition:transform .12s, border-color .12s, background .12s;display:flex;flex-direction:column;gap:6px;min-width:0}
.choice:hover{transform:translateY(-3px);background:rgba(255,255,255,.08)}
.choice[aria-pressed="true"]{border-color:var(--c, var(--moss));background:color-mix(in srgb, var(--c, var(--moss)) 16%, transparent);box-shadow:0 0 0 3px color-mix(in srgb, var(--c, var(--moss)) 30%, transparent)}
.choice .t{font:800 26px/1 var(--display);color:var(--c, var(--ink));letter-spacing:.02em}
.choice .d{font-size:15px;color:var(--ink-dim)}
.choice .dmg{margin-top:auto;padding-top:8px;font-size:14px;font-weight:800}
.choice .dmg span{color:var(--heart)}
.choice .badge{position:absolute;top:10px;right:10px;font:900 15px/1 var(--body);padding:6px 10px;border-radius:999px;background:var(--c);color:#111}
.ability{align-items:center;text-align:center;padding-top:10px}
.ability img{height:150px;width:auto;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.ability .t{font-size:34px}
.ability.taken{opacity:.45;cursor:default;transform:none}
.make-own{border-style:dashed}
.make-own .t{color:var(--moss)}

.custom{margin-top:18px;padding:18px;border-radius:16px;border:2px solid rgba(155,213,106,.45);background:rgba(155,213,106,.06);display:grid;gap:16px}
.custom h3{margin:0;font:800 26px/1 var(--display)}
.custom .lock{font-size:14px;color:var(--ink-dim);margin:-8px 0 0}
.pattern-list{display:grid;gap:8px}
.field .pattern{display:flex;font-weight:400;margin:0;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.25);cursor:pointer}
.pattern input{margin-top:4px;width:20px;height:20px;accent-color:var(--moss);flex:none}
.pattern b{display:block}
.pattern small{color:var(--ink-dim);font-size:14px}
.pattern:has(input:checked){border-color:var(--moss)}
.effect-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:rgba(255,255,255,.04);font-weight:800;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--moss);color:#14200d;border-color:var(--moss)}
.locked-line{font-size:15px;padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.err{color:#ffb3be;font-weight:700;font-size:15px;margin:0}

.done-burst{text-align:center;padding:10px 0}
.done-burst .step-q{font-size:clamp(38px,6vw,60px)}
.preview{position:sticky;top:16px}
.preview .card{--card-fs:clamp(11px, calc((100vw - 40px) / 25.2), 15px)}
.preview-label{font:800 13px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 10px;text-align:center}

/* ---------- the hero card (em-based so it scales to screen and print) ---------- */
.card{
  --card-fs:15px; --fit:1;
  font-size:var(--card-fs);
  width:25.2em; aspect-ratio:5/7; max-width:100%;
  position:relative; border-radius:1.1em; overflow:hidden;
  border:.2em solid rgba(255,255,255,.85);
  background:#0b0f0d var(--tunnel) center/cover no-repeat;
  color:#fff; font-family:var(--body);
  display:flex; flex-direction:column; padding:.9em .9em 1em;
  box-shadow:0 18px 40px rgba(0,0,0,.55);
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(5,8,7,.25) 0%, rgba(5,8,7,.55) 35%, rgba(5,8,7,.72) 100%);pointer-events:none}
.card > *{position:relative}
.card-head{display:grid;grid-template-columns:1fr auto;align-items:end;gap:.4em;min-height:7.6em;margin-bottom:.5em}
.card-head .nm{font:900 2.15em/1 var(--body);text-shadow:0 .1em .4em rgba(0,0,0,.8);overflow-wrap:anywhere}
.card-head .nm.empty{color:rgba(255,255,255,.45)}
.card-head .cls{font:800 1.5em/1 var(--display);color:var(--gc,#fff);margin-top:.15em;letter-spacing:.03em;text-shadow:0 .1em .3em rgba(0,0,0,.8)}
.card-head img{height:8em;width:auto;max-width:7.5em;object-fit:contain;margin-bottom:-.3em;filter:drop-shadow(0 .3em .5em rgba(0,0,0,.7))}
.cbox{border:.12em solid rgba(255,255,255,.92);background:rgba(0,0,0,.72);font-size:calc(1em * var(--fit))}
.cbox + .cbox{border-top:0}
.cgroup{display:flex;flex-direction:column;border-radius:.45em;overflow:hidden;flex:1;min-height:0}
.cgroup .cbox:first-child{border-radius:.45em .45em 0 0}
.cgroup .cbox:last-child{border-radius:0 0 .45em .45em;flex:1}
.crow{display:flex;justify-content:space-between;align-items:center;padding:.45em .7em;font-size:1.12em;gap:.6em}
.hearts-pips{color:var(--heart);letter-spacing:.06em}
.cstats{display:grid;grid-template-columns:repeat(3,1fr)}
.cstats div{padding:.45em .3em;text-align:center;font-size:1.05em;border-left:.12em solid rgba(255,255,255,.92);white-space:nowrap}
.cstats div:first-child{border-left:0}
.cstats .great{background:color-mix(in srgb, var(--gc) 32%, transparent)}
.cstats .unset{color:rgba(255,255,255,.4)}
.cpow{padding:.5em .7em;font-size:1em;line-height:1.3}
.cpow .pn{color:var(--gc,#fff);font-weight:800}
.cpow.empty{color:rgba(255,255,255,.4);font-style:italic}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%) translateY(20px);background:#1d2b22;border:1px solid var(--moss);color:var(--ink);padding:12px 20px;border-radius:999px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#printSheet{display:none}

@media (max-width:860px){
  .builder{grid-template-columns:1fr}
  .preview{position:static;display:flex;flex-direction:column;align-items:center}
  .hero-banner{grid-template-columns:1fr}
  .step-panel{min-height:0}
  .top .brand img{height:48px}
}
@media (max-width:420px){
  .roster{grid-template-columns:1fr}
  .slot .card{--card-fs:calc((100vw - 40px) / 25.2)}
  .new-hero{width:100%}
  .ability img{height:110px}
  .count{width:46px;height:46px;font-size:20px}
  .new-hero{aspect-ratio:auto;min-height:220px}
}

/* ---------- print: 4 big cards per letter page ---------- */
@page{size:letter;margin:.4in}
@media print{
  body{background:#fff;padding:0;color:#000}
  .backdrop,.fireflies,#app,.toast{display:none!important}
  #printSheet{display:grid;grid-template-columns:repeat(2,3.5in);gap:.3in;justify-content:center}
  #printSheet .card{--card-fs:10pt;width:25.2em;max-width:none;box-shadow:none;break-inside:avoid;page-break-inside:avoid}
}
</style>

/* ============ silly names (always 22 letters or fewer) ============ */
const NAME_TITLES = ["Sir","Lady","Captain","Professor","Little","Mighty","Princess","Duke","Wizard","Old","Baron","Queen","Doctor","Grandpa","Auntie"];
const NAME_CORES = ["Pickles","Noodle","Waffles","Muffin","Biscuit","Sprinkles","Nugget","Pudding","Bubbles","Turnip","Meatball","Tater","Wobbles","Pebble","Gizmo","Toadstool","Fuzzbutt","Crumpet","Mossy","Jellybean","Snorkel","Puddles","Doodle","Sniffles","Bonkers","Waddle","Cheddar","Burrito","Pancake","Twiggy","Banjo","Socks","Gumdrop","Potato"];
const NAME_TAILS = ["the Brave","the Bold","the Sneaky","the Wise","the Speedy","the Mighty","the Sparkly","the Sleepy","the Hungry","the Wobbly","the Loud","the Glorious","the Tiny","the Fluffy","the Grumpy","the Stinky","the Giggly","the Bouncy","Mudfoot","Snailspeed","Acornhead","von Snuggle","of the Moss","of the Muffins","the Unready"];
let lastRandom = "";
function sillyName(){
  const pick = a => a[Math.floor(Math.random()*a.length)];
  for(let i=0;i<40;i++){
    const r = Math.random();
    const n = r<.6 ? `${pick(NAME_TITLES)} ${pick(NAME_CORES)} ${pick(NAME_TAILS)}`
            : r<.8 ? `${pick(NAME_CORES)} ${pick(NAME_TAILS)}`
            : `${pick(NAME_TITLES)} ${pick(NAME_CORES)}`;
    if(n.length<=22 && n!==lastRandom){ lastRandom=n; return n; }
  }
  return "Sir Pickles the Brave";
}

/* ============ state ============ */
const STORE_KEY = "forest-guardians-party-v1";
let party = load();
let view = "party";
let draft = null;
let step = 0;
let confirmDelete = null;
let custom = {}; // per-tier custom form state in the builder
const STEPS = ["name","great","good","main","special","ultimate","done"];
const STEP_LABEL = {name:"Name", great:"Best at", good:"Good at", main:"Main", special:"Special", ultimate:"Ultimate", done:"Done"};

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const p = JSON.parse(raw); if(p && Array.isArray(p.heroes)) return {players:p.players||null, heroes:p.heroes}; }
  }catch(e){}
  return {players:null, heroes:[]};
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(party)); return true; }
  catch(e){ toast("This browser blocked saving. Use Export to keep your party."); return false; }
}
function uses(){
  const small = party.players && party.players < 4;
  return {special: small?6:3, ultimate: small?2:1, small};
}
function scores(h){
  const s = {strength:null, speed:null, brain:null};
  if(h.great) s[h.great]=5;
  if(h.good) s[h.good]=3;
  if(h.great && h.good){ const ok = ORDER.find(a=>a!==h.great && a!==h.good); s[ok]=1; }
  return s;
}
function hearts(h){ const s = scores(h).strength; return s==null ? null : HEARTS[s]; }

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => "h" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); }

/* ============ card ============ */
function cardHTML(h){
  const s = scores(h);
  const u = uses();
  const gc = h.great ? ABIL[h.great].color : "#fff";
  const hp = hearts(h);
  const ab = h.great ? ABIL[h.great].label : null;
  const stat = a => `<div class="${h.great===a?"great":""} ${s[a]==null?"unset":""}"><b>${ABIL[a].label}:</b> ${s[a]==null?"?":s[a]}</div>`;
  const pow = (tier, title) => {
    const p = h[tier];
    if(!p) return `<div class="cbox cpow empty"><b>${title}</b> &mdash; not picked yet</div>`;
    return `<div class="cbox cpow"><b>${title}</b> <span class="pn">${esc(p.name)}:</span> ${esc(p.desc)} <b>Roll:</b> d20+${ab}. <b>Damage:</b> ${esc(p.dmg)}</div>`;
  };
  return `<article class="card" style="--gc:${gc}">
    <div class="card-head">
      <div>
        <div class="nm ${h.name?"":"empty"}">${h.name?esc(h.name):"Your Hero"}</div>
        <div class="cls">${ab ? ab+" Hero" : "&nbsp;"}</div>
      </div>
      ${h.portrait && ART[h.portrait] ? `<img src="${ART[h.portrait]}" alt="">` : ""}
    </div>
    <div class="cgroup">
      <div class="cbox crow"><span><b>Hearts:</b> ${hp??"?"} ${hp?`<span class="hearts-pips">${"♥".repeat(hp)}</span>`:""}</span><span><b>Armor:</b> ${ARMOR}</span></div>
      <div class="cbox cstats">${ORDER.map(stat).join("")}</div>
      ${pow("main","Main Power:")}
      ${pow("special",`Special Power (${u.special}/Day):`)}
      ${pow("ultimate",`Ultimate Power (${u.ultimate}/Day):`)}
    </div>
  </article>`;
}
/* shrink box text a little if a long custom power would overflow the card */
function fitCards(root=document){
  root.querySelectorAll(".card").forEach(c=>{
    let f = 1; c.style.setProperty("--fit", f);
    const g = c.querySelector(".cgroup");
    let guard = 0;
    while(g.scrollHeight > g.clientHeight + 1 && f > .7 && guard++ < 12){ f -= .03; c.style.setProperty("--fit", f.toFixed(2)); }
  });
}

/* ============ party view ============ */
function renderParty(){
  const u = uses();
  const counts = [1,2,3,4,5,6].map(n=>`<button class="count" data-players="${n}" aria-pressed="${party.players===n}">${n}</button>`).join("");
  const note = !party.players ? `<p class="rule-note">Pick a number first. It changes how many times heroes can use their big powers.</p>`
    : u.small ? `<p class="rule-note"><b>Small party rule:</b> with fewer than 4 players, every hero gets Special Powers <b>6 times a day</b> and Ultimate Powers <b>2 times a day</b>.</p>`
    : `<p class="rule-note">Normal rules: Special Powers <b>3 times a day</b>, Ultimate Powers <b>once a day</b>.</p>`;
  const slots = party.heroes.map(h=>`
    <div class="slot">
      ${cardHTML(h)}
      <div class="slot-actions">
        ${confirmDelete===h.id
          ? `<span style="align-self:center;font-weight:800">Remove ${esc(h.name)}?</span>
             <button class="btn small danger" data-act="del-yes" data-id="${h.id}">Yes, remove</button>
             <button class="btn small" data-act="del-no">Keep</button>`
          : `<button class="btn small" data-act="edit" data-id="${h.id}">Edit</button>
             <button class="btn small" data-act="print-one" data-id="${h.id}">Print</button>
             <button class="btn small danger" data-act="del" data-id="${h.id}">Remove</button>`}
      </div>
    </div>`).join("");
  $("#view").innerHTML = `
    <section class="hero-banner">
      <div>
        <h1>Gather your party</h1>
        <p>Every Forest Guardian needs a name, one thing they’re great at, and three powers. Make a hero for each player, then print the cards for the table.</p>
      </div>
      <div class="panel players ${party.players?"":"ask"}">
        <div class="players-q">
          <h2>How many players?</h2>
          <p class="hint">Count everyone playing a hero (not the Dungeon Master).</p>
        </div>
        <div class="count-row">${counts}</div>
        ${note}
      </div>
    </section>
    <div class="party-head">
      <h2 class="section-h" style="font-size:34px">The Party ${party.heroes.length?`<span style="color:var(--ink-dim);font-size:22px">(${party.heroes.length})</span>`:""}</h2>
      <div class="party-tools">
        ${party.heroes.length?`<button class="btn small" data-act="print-all">Print all cards</button>`:""}
        ${party.heroes.length?`<button class="btn small" data-act="export">Export party</button>`:""}
        <button class="btn small" data-act="import">Import party</button>
      </div>
    </div>
    <div class="roster">
      ${slots}
      <div class="slot"><button class="new-hero" data-act="new"><span class="plus">+</span>Make a new hero<small>${party.heroes.length?"Add the next player":"Start with the first player"}</small></button></div>
    </div>
    <p class="saved-note">Heroes are saved in this browser on this device. Use <b>Export party</b> to keep a backup file or move your party to another device.</p>`;
  fitCards($("#view"));
}

/* ============ builder ============ */
function blankDraft(){ return {id:null, name:"", portrait:null, great:null, good:null, main:null, special:null, ultimate:null}; }
function startBuild(h){
  draft = h ? JSON.parse(JSON.stringify(h)) : blankDraft();
  custom = {};
  ["main","special","ultimate"].forEach(t=>{
    const p = draft[t];
    custom[t] = (p && p.custom) ? {open:true, name:p.name, desc:p.desc, pattern:p.pattern, effect:p.effect||"scared"} : {open:false, name:"", desc:"", pattern:PATTERNS[t].length===1?PATTERNS[t][0].id:null, effect:"scared"};
  });
  step = h ? STEPS.length-1 : 0;
  view = "build"; render(); scrollTo({top:0});
}
function stepValid(k){
  if(k==="name") return draft.name.trim().length>0;
  if(k==="great") return !!draft.great;
  if(k==="good") return !!draft.good;
  if(["main","special","ultimate"].includes(k)) return !!draft[k];
  return true;
}
function firstInvalid(){ return STEPS.findIndex(k=>!stepValid(k)); }

function renderBuild(){
  const k = STEPS[step];
  const stepsBar = STEPS.map((s,i)=>`<li class="${i===step?"now":(i<step||stepValid(s)&&i<firstInvalidOrEnd())?"done":""}">${STEP_LABEL[s]}</li>`).join("");
  $("#view").innerHTML = `
    <div class="builder">
      <section>
        <ol class="steps" aria-label="Steps">${stepsBar}</ol>
        <div class="panel step-panel" id="stepPanel">${stepBody(k)}</div>
      </section>
      <aside class="preview">
        <p class="preview-label">Your card</p>
        ${cardHTML(draft)}
      </aside>
    </div>`;
  fitCards($("#view"));
  if(k==="name"){ const i=$("#heroName"); if(i && !draft.name) i.focus({preventScroll:true}); }
}
function firstInvalidOrEnd(){ const f=firstInvalid(); return f<0?STEPS.length:f; }
function refreshCard(){
  const a = $(".preview .card"); if(!a) return;
  a.outerHTML = cardHTML(draft); fitCards($(".preview"));
}
function nav(nextOk, nextLabel="Next"){
  return `<div class="step-nav">
    ${step>0?`<button class="btn" data-act="back">Back</button>`:`<button class="btn" data-act="home">Cancel</button>`}
    <button class="btn primary" data-act="next" ${nextOk?"":"disabled"}>${nextLabel}</button>
  </div>`;
}
function stepBody(k){
  if(k==="name"){
    return `<h2 class="step-q">What is your hero’s name?</h2>
      <p class="step-help">Make it something fun to shout during a battle.</p>
      <div class="field">
        <label for="heroName">Hero name</label>
        <div class="name-row">
          <input id="heroName" class="text-in" maxlength="22" autocomplete="off" value="${esc(draft.name)}" placeholder="Sir Pickles the Brave">
          <button class="btn dice-btn" data-act="random-name" title="Pick a silly name" aria-label="Pick a random silly name">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M12 2 7.5 9.5h9zM3 7l4.5 2.5M21 7l-4.5 2.5M7.5 9.5 12 22l4.5-12.5M3 17l4.5-7.5M21 17l-4.5-7.5"/></svg>
            <span class="lbl">Random</span>
          </button>
        </div>
      </div>
      <p class="step-help" style="margin:22px 0 0">Pick a picture (you can skip this).</p>
      <div class="portraits">
        ${PORTRAITS.map(p=>`<button class="portrait" data-portrait="${p.id}" aria-pressed="${draft.portrait===p.id}" title="${p.label}"><img src="${ART[p.id]}" alt="${p.label}"></button>`).join("")}
        <button class="portrait none" data-portrait="" aria-pressed="${!draft.portrait}">No picture</button>
      </div>
      ${nav(stepValid("name"))}`;
  }
  if(k==="great"){
    return `<h2 class="step-q">What is ${esc(draft.name)} <em>great</em> at?</h2>
      <p class="step-help">Your great ability gets a <b>5</b>. All of your powers use it.</p>
      <div class="choices">
        ${ORDER.map(a=>`<button class="choice ability" style="--c:${ABIL[a].color}" data-great="${a}" aria-pressed="${draft.great===a}">
          ${draft.great===a?`<span class="badge">5</span>`:""}
          <img src="${ART[ABIL[a].art]}" alt="">
          <span class="t">${ABIL[a].label}</span>
          <span class="d">${ABIL[a].blurb}</span>
        </button>`).join("")}
      </div>
      ${nav(stepValid("great"))}`;
  }
  if(k==="good"){
    const rest = ORDER.filter(a=>a!==draft.great);
    return `<h2 class="step-q">What is ${esc(draft.name)} <em>good</em> at?</h2>
      <p class="step-help">This one gets a <b>3</b>. The other one gets a <b>1</b>.</p>
      <div class="choices">
        <div class="choice ability taken" style="--c:${ABIL[draft.great].color}" aria-pressed="true">
          <span class="badge">5</span><img src="${ART[ABIL[draft.great].art]}" alt=""><span class="t">${ABIL[draft.great].label}</span><span class="d">Your great ability</span>
        </div>
        ${rest.map(a=>`<button class="choice ability" style="--c:${ABIL[a].color}" data-good="${a}" aria-pressed="${draft.good===a}">
          ${draft.good===a?`<span class="badge">3</span>`:draft.good?`<span class="badge" style="background:#888">1</span>`:""}
          <img src="${ART[ABIL[a].art]}" alt="">
          <span class="t">${ABIL[a].label}</span>
          <span class="d">${ABIL[a].blurb}</span>
        </button>`).join("")}
      </div>
      ${draft.good?`<p class="rule-note" style="margin-top:20px">${ABIL[draft.good].label} gets a 3, so ${ABIL[ORDER.find(a=>a!==draft.great&&a!==draft.good)].label} gets a 1. With ${scores(draft).strength} Strength, ${esc(draft.name)} has <b>${hearts(draft)} Hearts</b>.</p>`:""}
      ${nav(stepValid("good"))}`;
  }
  if(["main","special","ultimate"].includes(k)){
    const info = TIER_INFO[k], list = POWERS[draft.great][k], cur = draft[k], c = custom[k];
    const u = uses();
    const perDay = k==="special"?` You get <b>${u.special} a day</b>.`:k==="ultimate"?` You get <b>${u.ultimate} a day</b>.`:"";
    return `<h2 class="step-q">${info.q}</h2>
      <p class="step-help">${info.help}${perDay} Roll: d20 + ${ABIL[draft.great].label}.</p>
      <div class="choices">
        ${list.map(p=>`<button class="choice" style="--c:${ABIL[draft.great].color}" data-power="${p.key}" aria-pressed="${!!cur && !cur.custom && cur.key===p.key}">
          <span class="t">${p.name}</span>
          <span class="d">${p.desc}</span>
          <span class="dmg">Damage: <span>${p.dmg}</span></span>
        </button>`).join("")}
        <button class="choice make-own" data-act="own" aria-pressed="${!!(cur && cur.custom) || c.open}">
          <span class="t">Make my own</span>
          <span class="d">Invent your own move. You pick from damage that’s fair for a ${info.label}.</span>
        </button>
      </div>
      ${c.open ? customForm(k) : ""}
      ${nav(stepValid(k))}`;
  }
  if(k==="done"){
    const editing = !!draft.id && party.heroes.some(h=>h.id===draft.id);
    return `<div class="done-burst">
        <h2 class="step-q">${esc(draft.name)} is ready!</h2>
        <p class="step-help" style="margin-inline:auto">Check the card. Tap any step above to change something.</p>
      </div>
      <div class="step-nav">
        <button class="btn" data-act="back">Back</button>
        <button class="btn primary" data-act="save">${editing?"Save changes":"Add to the party"}</button>
      </div>`;
  }
}
function customForm(k){
  const c = custom[k], info = TIER_INFO[k], pats = PATTERNS[k];
  const pat = pats.find(p=>p.id===c.pattern);
  return `<div class="custom" id="customForm">
    <h3>Your own ${info.label}</h3>
    <p class="lock">You make up the name and what it looks like. The damage stays fair, so pick one of the choices below.</p>
    <div class="field"><label for="cName">Power name</label>
      <input id="cName" class="text-in" maxlength="24" autocomplete="off" value="${esc(c.name)}" placeholder="${k==="main"?"Acorn Toss":k==="special"?"Mushroom Bounce":"Forest Fury"}"></div>
    <div class="field"><label for="cDesc">What happens when you use it?</label>
      <textarea id="cDesc" class="text-in" maxlength="90" placeholder="You throw a magic acorn that bonks an enemy on the head.">${esc(c.desc)}</textarea>
      <div class="count-left" id="cDescCount">${90-c.desc.length} letters left</div></div>
    <div class="field"><label>What does it do?</label>
      <div class="pattern-list">
        ${pats.map(p=>`<label class="pattern"><input type="radio" name="pat" value="${p.id}" ${c.pattern===p.id?"checked":""}><span><b>${p.label}</b><small>${p.note}</small></span></label>`).join("")}
      </div></div>
    ${pat && pat.effect ? `<div class="field"><label>What happens to them?</label><div class="effect-row">
      ${EFFECTS.map(e=>`<button class="chip" data-effect="${e.id}" aria-pressed="${c.effect===e.id}">${e.label}</button>`).join("")}</div></div>` : ""}
    <div class="locked-line"><b>Roll:</b> d20+${ABIL[draft.great].label}. <b>Damage:</b> <span id="cDmg">${pat?pat.dmg(c.effect):"pick what it does"}</span></div>
    <p class="err" id="cErr" hidden></p>
    <div><button class="btn primary" data-act="use-own">Use this power</button></div>
  </div>`;
}

/* ============ events ============ */
document.addEventListener("click", e=>{
  const b = e.target.closest("button, [data-act]");
  if(!b) return;
  if(b.id==="homeBtn"){ goHome(); return; }
  const act = b.dataset.act;

  if(b.dataset.players){ party.players = +b.dataset.players; save(); render(); return; }

  if(view==="party"){
    if(act==="new"){ if(!party.players){ toast("First, pick how many players."); document.querySelector(".players").scrollIntoView({behavior:"smooth",block:"center"}); return; } startBuild(null); }
    else if(act==="edit"){ startBuild(party.heroes.find(h=>h.id===b.dataset.id)); }
    else if(act==="del"){ confirmDelete=b.dataset.id; render(); }
    else if(act==="del-no"){ confirmDelete=null; render(); }
    else if(act==="del-yes"){ const h=party.heroes.find(x=>x.id===b.dataset.id); party.heroes=party.heroes.filter(x=>x.id!==b.dataset.id); confirmDelete=null; save(); render(); toast(`${h?h.name:"Hero"} left the party`); }
    else if(act==="print-one"){ printCards([party.heroes.find(h=>h.id===b.dataset.id)]); }
    else if(act==="print-all"){ printCards(party.heroes); }
    else if(act==="export"){ exportParty(); }
    else if(act==="import"){ $("#importFile").click(); }
    return;
  }

  // builder
  const k = STEPS[step];
  if(act==="home"){ goHome(); return; }
  if(act==="back"){ step=Math.max(0,step-1); render(); return; }
  if(act==="next"){ if(stepValid(k)){ step++; render(); scrollTo({top:0,behavior:"smooth"}); } return; }
  if(act==="save"){ saveDraft(); return; }
  if(b.closest(".steps")) return;

  if(b.dataset.portrait!==undefined){ draft.portrait=b.dataset.portrait||null; document.querySelectorAll(".portrait").forEach(x=>x.setAttribute("aria-pressed", x===b)); refreshCard(); return; }
  if(b.dataset.great){
    if(draft.great!==b.dataset.great){ draft.great=b.dataset.great; draft.good=null; draft.main=draft.special=draft.ultimate=null; }
    render(); return;
  }
  if(b.dataset.good){ draft.good=b.dataset.good; render(); return; }
  if(b.dataset.power){
    const p = POWERS[draft.great][k].find(x=>x.key===b.dataset.power);
    draft[k] = {key:p.key, name:p.name, desc:p.desc, dmg:p.dmg, custom:false};
    custom[k].open=false; render(); return;
  }
  if(act==="own"){ custom[k].open=true; render(); const f=$("#customForm"); if(f) f.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(b.dataset.effect){ custom[k].effect=b.dataset.effect; document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x===b)); updateCustomDmg(k); return; }
  if(act==="use-own"){ useCustom(k); return; }
  if(act==="random-name"){
    const inp=$("#heroName"); draft.name=sillyName(); inp.value=draft.name; refreshCard();
    const n=$("[data-act=next]"); if(n) n.disabled=false;
    b.classList.remove("roll"); void b.offsetWidth; b.classList.add("roll");
    return;
  }
});
// step chips are clickable to jump back to any reachable step
document.addEventListener("click", e=>{
  const li = e.target.closest(".steps li"); if(!li || view!=="build") return;
  const i = [...li.parentNode.children].indexOf(li);
  if(i <= firstInvalidOrEnd()){ step=i; render(); }
});
document.addEventListener("input", e=>{
  if(view!=="build") return;
  const k = STEPS[step];
  if(e.target.id==="heroName"){ draft.name=e.target.value; refreshCard(); const n=$("[data-act=next]"); if(n) n.disabled=!stepValid("name"); }
  if(e.target.id==="cName"){ custom[k].name=e.target.value; }
  if(e.target.id==="cDesc"){ custom[k].desc=e.target.value; $("#cDescCount").textContent=`${90-e.target.value.length} letters left`; }
});
document.addEventListener("change", e=>{
  if(view==="build" && e.target.name==="pat"){ const k=STEPS[step]; custom[k].pattern=e.target.value; const keepY=scrollY; render(); scrollTo({top:keepY}); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && view==="build" && e.target.id==="heroName" && stepValid("name")){ step++; render(); }
});
function updateCustomDmg(k){
  const c=custom[k], pat=PATTERNS[k].find(p=>p.id===c.pattern);
  $("#cDmg").textContent = pat ? pat.dmg(c.effect) : "pick what it does";
}
function useCustom(k){
  const c = custom[k], err = $("#cErr");
  const pat = PATTERNS[k].find(p=>p.id===c.pattern);
  const problem = !c.name.trim() ? "Give your power a name." : !c.desc.trim() ? "Tell us what happens when you use it." : !pat ? "Pick what your power does." : null;
  if(problem){ err.textContent=problem; err.hidden=false; return; }
  let desc = c.desc.trim(); if(!/[.!?]$/.test(desc)) desc += ".";
  draft[k] = {key:"custom", custom:true, name:c.name.trim(), desc, dmg:pat.dmg(c.effect), pattern:pat.id, effect:pat.effect?c.effect:null};
  step++; render(); scrollTo({top:0,behavior:"smooth"});
}
function saveDraft(){
  if(firstInvalid()!==STEPS.length-1 && firstInvalid()!==-1){ step=firstInvalid(); render(); return; }
  const hero = {...draft, id:draft.id||uid(), updatedAt:Date.now()};
  const i = party.heroes.findIndex(h=>h.id===hero.id);
  if(i>=0) party.heroes[i]=hero; else party.heroes.push(hero);
  save(); view="party"; draft=null; render(); scrollTo({top:0});
  toast(`${hero.name} joined the party!`);
}
function goHome(){ view="party"; draft=null; confirmDelete=null; render(); scrollTo({top:0}); }

/* ============ print / export / import ============ */
function printCards(list){
  const sheet = $("#printSheet");
  sheet.innerHTML = list.filter(Boolean).map(cardHTML).join("");
  sheet.style.display="grid"; sheet.style.position="absolute"; sheet.style.left="-9999px";
  sheet.querySelectorAll(".card").forEach(c=>c.style.setProperty("--card-fs","10pt"));
  fitCards(sheet);
  sheet.style.cssText="";
  window.print();
}
function exportParty(){
  const data = JSON.stringify({app:"forest-guardians-hero-maker", version:1, exported:new Date().toISOString(), players:party.players, heroes:party.heroes}, null, 2);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data],{type:"application/json"}));
  a.download = "forest-guardians-party.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast("Party saved to a file");
}
$("#importFile").addEventListener("change", async e=>{
  const f = e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!d || !Array.isArray(d.heroes)) throw 0;
    const ok = d.heroes.filter(h=>h && typeof h.name==="string" && ORDER.includes(h.great) && ORDER.includes(h.good) && h.main && h.special && h.ultimate);
    let added=0;
    ok.forEach(h=>{ h.id = h.id || uid(); const i=party.heroes.findIndex(x=>x.id===h.id); if(i>=0) party.heroes[i]=h; else { party.heroes.push(h); added++; } });
    if(d.players) party.players = d.players;
    save(); render(); toast(`Imported ${ok.length} hero${ok.length===1?"":"es"}`);
  }catch(_){ toast("That file isn’t a Hero Maker party file."); }
});

/* ============ boot ============ */
function render(){ view==="party" ? renderParty() : renderBuild(); }
(function fireflies(){
  const ff=$("#ff"); for(let i=0;i<18;i++){ const d=document.createElement("i"); d.style.left=Math.random()*100+"%"; d.style.top=(30+Math.random()*70)+"%"; d.style.animationDelay=(Math.random()*9)+"s"; d.style.animationDuration=(7+Math.random()*6)+"s"; ff.appendChild(d);} })();
render();
if(document.fonts) document.fonts.ready.then(()=>fitCards());
</script>
